name: Generate Assets & Snake

on:
  schedule:
    # Runs every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TheBizarreAbhishek
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fetch and Cache GitHub Stats SVGs
        run: |
          mkdir -p dist
          curl -f -s "https://github-readme-stats-fast.vercel.app/api?username=TheBizarreAbhishek&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=70A5FD&icon_color=F7768E&text_color=A9B1D6&count_private=true&include_all_commits=true" -o dist/github-stats.svg || true
          curl -f -s "https://github-readme-stats-fast.vercel.app/api/top-langs/?username=TheBizarreAbhishek&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=70A5FD&text_color=A9B1D6" -o dist/top-langs.svg || true

      - name: Deploy assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
